workflows:
  ios-release:
    name: Build iOS IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate Flutter build files
        script: |
          flutter precache --ios
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA Package
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r ZeaHR.ipa Payload
    artifacts:
      - ZeaHR.ipa
